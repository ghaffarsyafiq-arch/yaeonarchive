
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcard Biokimia Blok 2.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        customBlue: '#62B1D4',
                        customBlueDark: '#4a90b5',
                        customBlueLight: '#ebf6fa'
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS Animasi Flip yang kompatibel dengan semua browser/mobile */
        .flip-container {
            perspective: 1000px;
        }
        .flipper {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .flip-container.flipped .flipper {
            transform: rotateY(180deg);
        }
        .front, .back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; /* Fix utama untuk Safari/iOS */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .back {
            transform: rotateY(180deg);
        }
        /* Mencegah elemen teks memblokir klik/tap */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans flex flex-col no-select">

    <!-- Header -->
    <header class="bg-customBlue text-white p-5 shadow-lg text-center">
        <h1 class="text-3xl font-extrabold tracking-wide drop-shadow-md">Flashcard Biokimia</h1>
        <p class="text-sm font-medium mt-1 text-white/90">Blok 2.2 - Sistem Pencernaan & Nefro-Urinari</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- Filter Kategori -->
        <div class="mb-6 w-full max-w-2xl bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <label for="categoryFilter" class="block text-sm font-bold text-gray-600 mb-2">Pilih Bab Materi:</label>
            <select id="categoryFilter" class="block w-full p-3 border-2 border-customBlue rounded-lg bg-customBlueLight text-gray-800 focus:outline-none focus:ring-2 focus:ring-customBlue transition">
                <option value="Semua">Tampilkan Semua Bab (40+ Soal)</option>
                <option value="Lipid">Praktikum 1: Analisis Lipid</option>
                <option value="Enzim">Praktikum 2: Penentuan Aktivitas Enzim</option>
                <option value="Protein">Praktikum 3: Analisis Protein</option>
                <option value="Karbohidrat">Praktikum 4: Analisis Karbohidrat</option>
            </select>
        </div>

        <!-- Flashcard Container -->
        <div class="flip-container relative w-full max-w-2xl h-80 md:h-96 cursor-pointer" id="flashcard">
            <div class="flipper w-full h-full rounded-2xl shadow-xl transition-shadow duration-300 hover:shadow-2xl">
                
                <!-- Front (Pertanyaan) -->
                <div class="front bg-white rounded-2xl flex flex-col items-center justify-center p-6 sm:p-8 border-t-8 border-customBlue">
                    <span id="cardCategory" class="absolute top-4 left-4 bg-customBlue text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Kategori</span>
                    <span class="absolute top-4 right-4 text-customBlue text-3xl font-serif">Q</span>
                    
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 text-center leading-relaxed" id="cardQuestion">Pertanyaan akan muncul di sini</h2>
                    
                    <p class="absolute bottom-4 text-customBlue font-bold text-sm animate-pulse flex items-center gap-2 pointer-events-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                        Tap / Klik untuk melihat jawaban
                    </p>
                </div>

                <!-- Back (Jawaban) -->
                <div class="back bg-customBlueLight rounded-2xl flex flex-col items-center justify-center p-6 sm:p-8 border-t-8 border-customBlueDark">
                    <span class="absolute top-4 right-4 text-customBlueDark text-3xl font-serif">A</span>
                    
                    <div class="w-full h-full flex items-center justify-center overflow-hidden">
                        <h2 class="text-lg sm:text-xl font-medium text-gray-800 text-center leading-relaxed" id="cardAnswer">Jawaban akan muncul di sini</h2>
                    </div>
                    
                    <p class="absolute bottom-4 text-gray-500 font-medium text-sm flex items-center gap-2 pointer-events-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        Tap lagi untuk kembali
                    </p>
                </div>

            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex items-center justify-between w-full max-w-2xl mt-8 bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-100">
            <button id="btnPrev" class="flex items-center gap-1 sm:gap-2 px-3 py-2 sm:px-5 sm:py-2.5 bg-white text-customBlue border-2 border-customBlue font-bold rounded-lg hover:bg-customBlueLight transition active:scale-95 text-sm sm:text-base">
                &larr; <span class="hidden sm:inline">Sebelumnya</span>
            </button>
            
            <span class="bg-gray-100 px-3 py-1 sm:px-4 sm:py-2 rounded-lg font-bold text-gray-600 border border-gray-200">
                <span id="cardCounter" class="text-customBlueDark">1 / 10</span>
            </span>
            
            <button id="btnNext" class="flex items-center gap-1 sm:gap-2 px-3 py-2 sm:px-5 sm:py-2.5 bg-customBlue text-white font-bold rounded-lg shadow-md hover:bg-customBlueDark transition active:scale-95 text-sm sm:text-base">
                <span class="hidden sm:inline">Selanjutnya</span> &rarr;
            </button>
        </div>

    </main>

    <script>
        // Database Kartu Lengkap (Minimal 10 soal per bab)
        const allCards = [
            // BAB 1: LIPID (11 Soal)
            { category: "Lipid", question: "Metode enzimatik apa yang digunakan untuk analisis kuantitatif kolesterol darah?", answer: "Metode CHOD-PAP (Cholesterol Oxidase-Peroxidase Aminoantipyrine Phenol)." },
            { category: "Lipid", question: "Berapa nilai normal kolesterol darah menurut buku panduan?", answer: "< 200 mg/dL." },
            { category: "Lipid", question: "Pada tahap pertama metode CHOD-PAP, enzim apa yang menghidrolisis kolesterol ester menjadi kolesterol bebas dan asam lemak?", answer: "Enzim Cholesterol Esterase (CHE)." },
            { category: "Lipid", question: "Apa nama senyawa berwarna merah yang terbentuk di akhir reaksi (Reaksi Trinder) pada uji kolesterol dan trigliserida?", answer: "Senyawa Quinoneimine." },
            { category: "Lipid", question: "Metode apa yang digunakan untuk analisis kuantitatif trigliserida darah?", answer: "Metode GPO (Gliserol-3 Phosphat-Oksidase)." },
            { category: "Lipid", question: "Berapa rentang nilai normal untuk trigliserida darah?", answer: "< 150 mg/dL." },
            { category: "Lipid", question: "Pada kondisi obesitas, mengapa dapat terjadi peningkatan trigliserida (hipertrigliseridemia)?", answer: "Karena peningkatan pelepasan asam lemak bebas dari jaringan adiposa yang menghambat lipogenesis dan klirens serum triasilgliserol." },
            { category: "Lipid", question: "Apa prinsip dasar dari uji kelarutan lemak?", answer: "Prinsip 'Like dissolves like'. Senyawa polar larut pada pelarut polar, dan senyawa nonpolar (seperti lemak) larut pada pelarut nonpolar." },
            { category: "Lipid", question: "Sebutkan 2 contoh pelarut nonpolar yang dapat melarutkan lemak/minyak dengan baik!", answer: "n-Heksana dan eter." },
            { category: "Lipid", question: "Lipoprotein apa yang disintesis hepar dan berfungsi mengangkut kolesterol dari jaringan perifer kembali ke hepar (bersifat ateroprotektif)?", answer: "HDL (High Density Lipoprotein)." },
            { category: "Lipid", question: "Apa salah satu kriteria Sindrom Metabolik berdasarkan lingkar pinggang untuk laki-laki (ras Asia)?", answer: "> 90 cm." },

            // BAB 2: ENZIM (10 Soal)
            { category: "Enzim", question: "Di mana saja sumber utama enzim amilase di dalam tubuh diproduksi?", answer: "Pankreas (sekitar 40-45%) dan Kelenjar Saliva (sekitar 55-60%)." },
            { category: "Enzim", question: "Apa fungsi spesifik enzim amilase dalam sistem pencernaan?", answer: "Menghidrolisis ikatan glikosidik α-1,4 pada amilum (pati) untuk dipecah menjadi maltosa, maltotriosa, dan dekstrin." },
            { category: "Enzim", question: "Berapa nilai rujukan normal enzim amilase darah pada pria dan wanita?", answer: "< 100 U/L." },
            { category: "Enzim", question: "Peningkatan drastis enzim amilase darah (hiperamilasemia) dan munculnya nyeri abdomen khas menjadi penanda diagnostik utama untuk penyakit apa?", answer: "Pankreatitis Akut." },
            { category: "Enzim", question: "Substrat sintetis apa yang digunakan dalam analisis fotometri enzimatik untuk mengukur aktivitas amilase darah?", answer: "Substrat EPS-G7 (4,6-ethylidene-(G7)-p-nitrophenyl-(G1)-α-D-maltoheptaoside)." },
            { category: "Enzim", question: "Berapa suhu dan pH optimal untuk kerja amilase saliva?", answer: "Suhu optimal sekitar 37°C dan pH optimal 6 - 7." },
            { category: "Enzim", question: "Mengapa pencernaan karbohidrat oleh amilase saliva terhenti ketika makanan mencapai lambung?", answer: "Karena amilase terinaktivasi pada kondisi lambung yang sangat asam (pH ≤ 4)." },
            { category: "Enzim", question: "Indikator cairan apa yang digunakan untuk mendeteksi keberadaan amilum dalam uji aktivitas amilase saliva?", answer: "Larutan Iodium (Iod 0,01 N)." },
            { category: "Enzim", question: "Apa warna yang terbentuk ketika larutan iodium diteteskan pada amilum utuh (belum dihidrolisis)?", answer: "Biru kehitaman." },
            { category: "Enzim", question: "Apa yang dimaksud dengan 'titik akromik' pada pengamatan hidrolisis pati oleh amilase saliva?", answer: "Titik waktu di mana campuran reaksi menjadi jernih (tidak lagi memberikan warna biru dengan iodium), menandakan amilum telah terhidrolisis sempurna." },

            // BAB 3: PROTEIN (10 Soal)
            { category: "Protein", question: "Analisis kuantitatif total protein darah dalam praktikum menggunakan metode apa?", answer: "Metode Biuret." },
            { category: "Protein", question: "Bagaimana prinsip reaksi pada Metode Biuret?", answer: "Ikatan peptida bereaksi dengan ion tembaga(II) (Cu2+) dalam suasana alkalis sehingga membentuk kompleks molekul yang berwarna ungu." },
            { category: "Protein", question: "Berapa kisaran nilai normal total protein dalam darah untuk orang dewasa?", answer: "6,6 - 8,7 gr/dL." },
            { category: "Protein", question: "Protein plasma apa yang berperan sangat penting dalam mempertahankan tekanan osmotik koloid plasma?", answer: "Albumin." },
            { category: "Protein", question: "Kondisi penurunan kadar albumin (hipoalbuminemia) dapat menyebabkan perpindahan cairan ke jaringan interstisial yang berujung pada terjadinya?", answer: "Edema (pembengkakan jaringan karena cairan)." },
            { category: "Protein", question: "Bentuk malnutrisi berat yang disebabkan defisiensi protein tinggi (namun asupan energi relatif cukup) yang ditandai oleh edema generalisata disebut?", answer: "Kwashiorkor." },
            { category: "Protein", question: "Protein memiliki empat tingkat struktur. Struktur mana yang menunjukkan urutan linear asam amino yang dihubungkan oleh ikatan peptida?", answer: "Struktur Primer." },
            { category: "Protein", question: "Apa yang dimaksud dengan proses denaturasi protein?", answer: "Perubahan atau kerusakan struktur sekunder, tersier, dan kuartener molekul protein akibat faktor luar, tanpa merusak struktur primer (tanpa memutus ikatan peptida)." },
            { category: "Protein", question: "Bagaimana mekanisme alkohol absolut menyebabkan koagulasi atau pengendapan protein?", answer: "Alkohol lebih kuat mengikat air, sehingga mengganggu/merusak lapisan hidrasi di sekitar molekul protein yang membuat kelarutan protein menurun tajam (terdenaturasi dan mengendap)." },
            { category: "Protein", question: "Sebutkan nama protein plasma yang berfungsi sebagai molekul transport spesifik untuk membawa zat besi di dalam darah!", answer: "Transferin." },

            // BAB 4: KARBOHIDRAT (11 Soal)
            { category: "Karbohidrat", question: "Metode enzimatik apa yang dipraktikkan untuk mengukur kadar glukosa darah?", answer: "Metode GOD-PAP (Glucose Oxidase-Peroxidase Aminoantipyrine Phenol)." },
            { category: "Karbohidrat", question: "Berapa nilai normal untuk Glukosa Darah Puasa (GDP)?", answer: "< 126 mg/dL." },
            { category: "Karbohidrat", question: "Berapa nilai normal batas maksimal untuk Glukosa Darah Sewaktu (GDS)?", answer: "< 200 mg/dL." },
            { category: "Karbohidrat", question: "Metabolisme aerob terjadi dengan oksigen yang cukup dan memecah 1 molekul glukosa menjadi energi siap pakai berupa?", answer: "36 molekul ATP." },
            { category: "Karbohidrat", question: "Hormon anabolik apa yang disekresikan oleh sel beta pankreas dan berperan penting dalam menurunkan kadar glukosa darah?", answer: "Insulin." },
            { category: "Karbohidrat", question: "Resistensi insulin dan kegagalan sel beta pankreas memproduksi insulin dapat memicu timbulnya penyakit apa?", answer: "Diabetes Mellitus Tipe 2 (sebelumnya dikenal sebagai NIDDM)." },
            { category: "Karbohidrat", question: "Pada proses penyerapan di usus halus, glukosa masuk ke dalam sel enterosit melalui transporter khusus secara simport bersama ion natrium. Apa nama transporternya?", answer: "Transporter SGLT-1 (Sodium-Glucose Linked Transporter-1)." },
            { category: "Karbohidrat", question: "Enzim apa yang mengoksidasi glukosa menjadi asam glukonat dan hidrogen peroksida pada tahapan awal pemeriksaan GOD-PAP?", answer: "Enzim Glukosa Oksidase (Glucose Oxidase)." },
            { category: "Karbohidrat", question: "Apa nama uji kualitatif yang digunakan untuk membedakan monosakarida (gula pereduksi kuat) dengan disakarida?", answer: "Uji Barfoed." },
            { category: "Karbohidrat", question: "Bagaimana prinsip dari Uji Barfoed?", answer: "Dalam suasana asam dan pemanasan singkat (2-3 menit), monosakarida lebih cepat mereduksi ion Cu2+ dibanding disakarida yang bereaksi lambat." },
            { category: "Karbohidrat", question: "Tanda atau hasil positif apa yang muncul pada tabung sampel monosakarida jika dilakukan Uji Barfoed?", answer: "Terbentuknya presipitasi/endapan tembaga(I) oksida (Cu2O) yang berwarna merah bata." }
        ];

        let currentDeck = [...allCards];
        let currentIndex = 0;
        let isFlipped = false;

        const flashcardEl = document.getElementById('flashcard');
        const questionEl = document.getElementById('cardQuestion');
        const answerEl = document.getElementById('cardAnswer');
        const categoryEl = document.getElementById('cardCategory');
        const counterEl = document.getElementById('cardCounter');
        const filterEl = document.getElementById('categoryFilter');

        function updateCardDisplay() {
            if (currentDeck.length === 0) return;
            
            const card = currentDeck[currentIndex];
            questionEl.innerText = card.question;
            answerEl.innerText = card.answer;
            categoryEl.innerText = card.category;
            counterEl.innerText = `${currentIndex + 1} / ${currentDeck.length}`;

            // Reset kartu ke bagian depan setiap pindah soal
            if (isFlipped) {
                flashcardEl.classList.remove('flipped');
                isFlipped = false;
            }
        }

        function flipCard() {
            if (currentDeck.length === 0) return;
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardEl.classList.add('flipped');
            } else {
                flashcardEl.classList.remove('flipped');
            }
        }

        function nextCard(e) {
            if (e) e.stopPropagation();
            if (currentIndex < currentDeck.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            updateCardDisplay();
        }

        function prevCard(e) {
            if (e) e.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = currentDeck.length - 1;
            }
            updateCardDisplay();
        }

        function filterCategory() {
            const selectedCategory = filterEl.value;
            if (selectedCategory === "Semua") {
                currentDeck = [...allCards];
            } else {
                currentDeck = allCards.filter(card => card.category === selectedCategory);
            }
            currentIndex = 0;
            updateCardDisplay();
        }

        // EVENT LISTENERS
        // Menggunakan addEventListener menjamin klik terdeteksi baik di HP maupun PC
        flashcardEl.addEventListener('click', flipCard);
        document.getElementById('btnNext').addEventListener('click', nextCard);
        document.getElementById('btnPrev').addEventListener('click', prevCard);
        filterEl.addEventListener('change', filterCategory);

        // Shortcut Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") nextCard();
            if (e.key === "ArrowLeft") prevCard();
            if (e.key === " " || e.key === "Enter") {
                e.preventDefault();
                flipCard();
            }
        });

        // Init
        window.onload = updateCardDisplay;
    </script>
</body>
</html>
