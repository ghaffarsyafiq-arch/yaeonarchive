
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Biokimia Blok 2.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS untuk efek 3D Flip pada Flashcard */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .flip-card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">Flashcard Biokimia Blok 2.2</h1>
        <p class="text-sm text-blue-200">Sistem Pencernaan & Nefro-Urinari</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- Filter Kategori -->
        <div class="mb-6 w-full max-w-xl">
            <label for="categoryFilter" class="block text-sm font-medium text-gray-700 mb-2">Pilih Bab Materi:</label>
            <select id="categoryFilter" class="block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" onchange="filterCategory()">
                <option value="Semua">Semua Bab</option>
                <option value="Lipid">Praktikum 1: Analisis Lipid</option>
                <option value="Enzim">Praktikum 2: Penentuan Aktivitas Enzim</option>
                <option value="Protein">Praktikum 3: Analisis Protein</option>
                <option value="Karbohidrat">Praktikum 4: Analisis Karbohidrat</option>
            </select>
        </div>

        <!-- Flashcard Container -->
        <div class="relative w-full max-w-xl h-80 perspective-1000 cursor-pointer" id="flashcard" onclick="flipCard()">
            <div class="flip-card-inner w-full h-full relative transform-style-3d rounded-2xl shadow-xl">
                
                <!-- Front (Pertanyaan) -->
                <div class="absolute w-full h-full backface-hidden bg-white rounded-2xl flex flex-col items-center justify-center p-8 border-t-4 border-blue-500">
                    <span id="cardCategory" class="absolute top-4 left-4 bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">Kategori</span>
                    <h2 class="text-xl md:text-2xl font-bold text-gray-800 text-center" id="cardQuestion">Pertanyaan akan muncul di sini</h2>
                    <p class="absolute bottom-4 text-gray-400 text-sm animate-pulse">Klik untuk melihat jawaban</p>
                </div>

                <!-- Back (Jawaban) -->
                <div class="absolute w-full h-full backface-hidden bg-blue-50 rounded-2xl flex flex-col items-center justify-center p-8 rotate-y-180 border-t-4 border-green-500">
                    <h2 class="text-xl md:text-2xl font-medium text-gray-800 text-center" id="cardAnswer">Jawaban akan muncul di sini</h2>
                    <p class="absolute bottom-4 text-gray-400 text-sm">Klik untuk kembali</p>
                </div>

            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex items-center justify-between w-full max-w-xl mt-8">
            <button onclick="prevCard()" class="px-6 py-2 bg-white text-blue-600 font-semibold rounded-lg shadow hover:bg-blue-50 transition border border-blue-200">
                &larr; Prev
            </button>
            <span id="cardCounter" class="text-gray-600 font-medium">1 / 10</span>
            <button onclick="nextCard()" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition">
                Next &rarr;
            </button>
        </div>

    </main>

    <!-- Script Logika Flashcard -->
    <script>
        // Database Kartu
        const allCards = [
            // LIPID
            { category: "Lipid", question: "Metode apa yang digunakan untuk analisis kuantitatif Kolesterol darah?", answer: "Metode CHOD-PAP (enzimatik kolorimetrik)." },
            { category: "Lipid", question: "Berapa nilai normal kolesterol darah?", answer: "< 200 mg/dL." },
            { category: "Lipid", question: "Lipoprotein apa yang memiliki sifat ateroprotektif (membawa kolesterol dari perifer ke hati)?", answer: "HDL (High Density Lipoprotein)." },
            { category: "Lipid", question: "Apa prinsip dari kelarutan lemak?", answer: "'Like dissolves like'. Lemak (nonpolar) hanya larut dalam pelarut nonpolar seperti alkohol absolut, aseton, atau heksana." },
            
            // ENZIM
            { category: "Enzim", question: "Peningkatan drastis enzim amilase dalam darah mengindikasikan penyakit apa?", answer: "Pankreatitis Akut." },
            { category: "Enzim", question: "Pada uji kualitatif amilase saliva, perubahan warna apa yang menunjukkan amilum telah terhidrolisis penuh (Titik Akromik)?", answer: "Campuran iodium dan substrat berubah menjadi jernih (tidak lagi biru kehitaman)." },
            { category: "Enzim", question: "Berapa suhu dan pH optimal untuk kerja enzim amilase saliva?", answer: "Suhu 37°C dan pH 6-7." },
            
            // PROTEIN
            { category: "Protein", question: "Apa nama metode untuk mengukur total protein darah?", answer: "Metode Biuret." },
            { category: "Protein", question: "Bagaimana prinsip dari Metode Biuret?", answer: "Ikatan peptida bereaksi dengan ion Cu2+ dalam suasana alkalis membentuk kompleks berwarna ungu." },
            { category: "Protein", question: "Kondisi malnutrisi protein berat yang ditandai dengan edema generalisata disebut?", answer: "Kwashiorkor." },
            { category: "Protein", question: "Mengapa penambahan alkohol dapat menyebabkan koagulasi protein?", answer: "Alkohol mengikat air, merusak lapisan hidrasi molekul protein sehingga menurunkan kelarutannya (protein terdenaturasi lalu mengendap)." },
            
            // KARBOHIDRAT
            { category: "Karbohidrat", question: "Metode enzimatik apa yang digunakan untuk analisis glukosa darah?", answer: "Metode GOD-PAP." },
            { category: "Karbohidrat", question: "Berapa nilai normal Glukosa Darah Puasa (GDP)?", answer: "< 126 mg/dL." },
            { category: "Karbohidrat", question: "Apa tujuan dari dilakukannya Uji Barfoed?", answer: "Untuk membedakan monosakarida (bereaksi cepat membentuk endapan merah bata) dengan disakarida (bereaksi lambat)." },
            { category: "Karbohidrat", question: "Warna apa yang terbentuk dari hasil reaksi Trinder pada metode GOD-PAP?", answer: "Warna merah (Quinoneimine)." }
        ];

        let currentDeck = [...allCards];
        let currentIndex = 0;
        let isFlipped = false;

        // Elemen DOM
        const flashcardEl = document.getElementById('flashcard');
        const questionEl = document.getElementById('cardQuestion');
        const answerEl = document.getElementById('cardAnswer');
        const categoryEl = document.getElementById('cardCategory');
        const counterEl = document.getElementById('cardCounter');

        // Fungsi inisialisasi
        function updateCardDisplay() {
            if (currentDeck.length === 0) return;
            
            const card = currentDeck[currentIndex];
            questionEl.innerText = card.question;
            answerEl.innerText = card.answer;
            categoryEl.innerText = card.category;
            counterEl.innerText = `${currentIndex + 1} / ${currentDeck.length}`;

            // Pastikan kartu menghadap depan saat berganti soal
            if (isFlipped) {
                flashcardEl.classList.remove('flipped');
                isFlipped = false;
            }
        }

        // Animasi flip
        function flipCard() {
            if (currentDeck.length === 0) return;
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardEl.classList.add('flipped');
            } else {
                flashcardEl.classList.remove('flipped');
            }
        }

        // Navigasi kartu
        function nextCard() {
            if (currentIndex < currentDeck.length - 1) {
                currentIndex++;
                updateCardDisplay();
            } else {
                // Loop kembali ke awal
                currentIndex = 0;
                updateCardDisplay();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCardDisplay();
            } else {
                // Loop ke akhir
                currentIndex = currentDeck.length - 1;
                updateCardDisplay();
            }
        }

        // Filter berdasarkan Bab/Kategori
        function filterCategory() {
            const selectedCategory = document.getElementById('categoryFilter').value;
            
            if (selectedCategory === "Semua") {
                currentDeck = [...allCards];
            } else {
                currentDeck = allCards.filter(card => card.category === selectedCategory);
            }
            
            currentIndex = 0;
            updateCardDisplay();
        }

        // Inisialisasi awal
        window.onload = () => {
            updateCardDisplay();
        };
    </script>
</body>
</html>
